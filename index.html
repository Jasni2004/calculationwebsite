<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>
<body>

<h2>Student Marks & Grade Calculator</h2>

Name: <input type="text" id="name"><br><br>

Gender:
<input type="radio" name="gender" value="Male" checked> Male
<input type="radio" name="gender" value="Female"> Female<br><br>

Course:
<input type="checkbox" value="HNDIT" class="course" checked> HNDIT
<input type="checkbox" value="HNDSE" class="course" checked> HNDE
<input type="checkbox" value="HNDJA" class="course"> HNDA<br><br>

<table border="1" cellpadding="10">
<tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>
<tr>
<td>Machine Learning</td>
<td><input type="number" id="m1" value="85"></td>
<td id="g1">A</td>
</tr>
<tr>
<td>Computer Network</td>
<td><input type="number" id="m2" value="60"></td>
<td id="g2">B</td>
</tr>
<tr>
<td>Architecture</td>
<td><input type="number" id="m3" value="30"></td>
<td id="g3">D</td>
</tr>
<tr><th colspan="2">Average</th><th id="avg">58.33</th></tr>
</table>

<br>
<button onclick="calculate()">Calculate</button>
<button onclick="nextPage()">Click</button>

<script>
function calculate() {
    let marks = [
        Number(document.getElementById("m1").value),
        Number(document.getElementById("m2").value),
        Number(document.getElementById("m3").value)
    ];

    for (let i = 0; i < 3; i++) {
        if (marks[i] < 0 || marks[i] > 100) {
            alert("Enter marks between 0 and 100");
            return;
        }

        document.getElementById("g" + (i + 1)).innerText =
            marks[i] >= 75 ? "A" :
            marks[i] >= 60 ? "B" :
            marks[i] >= 40 ? "C" : "D";
    }

    document.getElementById("avg").innerText =
        (marks.reduce((a, b) => a + b, 0) / 3).toFixed(2);
}

function nextPage() {
    calculate();

    let name = document.getElementById("name").value;
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    ).value;

    let courses = [...document.querySelectorAll(".course:checked")]
        .map(c => c.value).join(", ");

    

    let grades = ["g1", "g2", "g3"].map(
        id => document.getElementById(id).innerText
    );

    let average = document.getElementById("avg").innerText;

    let result = `
    <h1>Student Results</h1>
    <p>Name: <b>${name}</b></p>
    <p>Gender: <b>${gender}</b></p>
    <p>Course: <b>${courses || "None selected"}</b></p>
    <br>
    <div class="grade">Machine Learning: <b>${grades[0]}</b></div>
    <br>
    <div class="grade">Computer Network: <b>${grades[1]}</b></div>
    <br>
    <div class="grade">Architecture: <b>${grades[2]}</b></div>
    <br>
    <div class="avg"> Average: <b>${average}</b></div>
    `;

    let page = window.open("", "_blank");
    page.document.write(result);
    page.document.close();
}
</script>

</body>
</html>
